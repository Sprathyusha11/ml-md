name: Automated Model Training
on:
push:
branches:["main"]
pull_request:
branches:["main"]
jobs:
train_model:
runs-on:ubuntu-latest
steps:
-name: Check Repository Code
uses:actions/checkout@v4
-name:Check Repository Files
run:|
echo "Current directory:"
pwd
echo"Files in repository root:"
ls-la
echo"Searching for test_model.py:"
find.-name"test_model.py"
-name:Checkout Repository Code
uses:actions/checkout@v4
-name:Set up Python
uses:action/setup-python@v5
with:
python-version:'3.10'
-name:install Dependencies
run:|
python -m pip install --upgrade pip
python -m pip install pandas numpy scikit-learn joblib pytest
-name:Execute Model Traning
run:python train.py
-name:Execute Model Test
run:pytest -v test_maodel.py
-name:Exxecute Model Inference
run:python predict.py
-name:Upload Trained Model
uses:actions/upload-artifact@v4
with:
name:trained-ml-model
path:best_model.joblib
